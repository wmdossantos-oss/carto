<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minha Agenda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f5f3ee;
    --paper-raised:#fdfcf9;
    --ink:#242220;
    --ink-soft:#68625b;
    --rule:#dcd6c9;
    --trabalho:#41548f;
    --estudos:#2f7d72;
    --casa:#77803a;
    --pessoal:#a34f74;
    --high:#b3401f;
    --shadow: 0 1px 2px rgba(36,34,32,0.06), 0 6px 16px -8px rgba(36,34,32,0.18);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Work Sans', sans-serif;
    background:
      radial-gradient(ellipse at top left, rgba(65,84,143,0.04), transparent 45%),
      var(--paper);
    color:var(--ink);
    min-height:100vh;
    padding:32px 20px 60px;
  }
  .wrap{max-width:920px;margin:0 auto;}

  /* ---- Header ---- */
  header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:26px;flex-wrap:wrap;}
  .brand-eyebrow{font-family:'IBM Plex Mono', monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 4px;}
  h1{font-family:'Fraunces', serif;font-weight:600;font-size:clamp(28px,4vw,40px);margin:0;letter-spacing:-0.01em;}
  .today-pill{font-family:'IBM Plex Mono', monospace;font-size:12.5px;color:var(--ink-soft);background:var(--paper-raised);border:1px solid var(--rule);border-radius:20px;padding:7px 14px;white-space:nowrap;}

  /* ---- Quote card (signature element: pinned note) ---- */
  .quote-card{
    position:relative;
    background:var(--paper-raised);
    border-radius:3px;
    padding:26px 30px 24px;
    margin-bottom:30px;
    box-shadow:var(--shadow);
    transform:rotate(-0.4deg);
    border-left:3px solid var(--trabalho);
  }
  .quote-card::before{
    content:"";
    position:absolute;
    top:-9px;left:34px;
    width:22px;height:14px;
    background:#e4dcc4;
    border:1px solid #cfc4a0;
    border-radius:2px;
    box-shadow:0 2px 3px rgba(0,0,0,0.12);
    transform:rotate(-3deg);
  }
  .quote-label{font-family:'IBM Plex Mono', monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.13em;color:var(--ink-soft);margin:0 0 10px;}
  .quote-text{font-family:'Fraunces', serif;font-style:italic;font-weight:500;font-size:clamp(18px,2.4vw,23px);line-height:1.45;margin:0;}
  .quote-refresh{
    margin-top:14px;border:none;background:none;font-family:'IBM Plex Mono', monospace;
    font-size:11px;color:var(--trabalho);cursor:pointer;padding:0;letter-spacing:.03em;
    text-decoration:underline;text-underline-offset:3px;
  }
  .quote-refresh:hover{color:var(--ink);}

  /* ---- Day tabs ---- */
  .day-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:22px;}
  .day-tab{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;letter-spacing:.03em;
    background:transparent;
    border:1px solid var(--rule);
    color:var(--ink-soft);
    padding:9px 15px;
    border-radius:8px 8px 0 0;
    cursor:pointer;
    white-space:nowrap;
    transition:all .15s ease;
  }
  .day-tab:hover{color:var(--ink);border-color:#c3bca8;}
  .day-tab.active{
    background:var(--paper-raised);
    color:var(--ink);
    border-color:var(--rule);
    border-bottom-color:var(--paper-raised);
    font-weight:600;
    box-shadow:0 -2px 6px rgba(36,34,32,0.05);
  }
  .day-tab .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--high);margin-left:6px;vertical-align:middle;opacity:0;}
  .day-tab.has-pending .dot{opacity:1;}

  /* ---- Panel ---- */
  .panel{background:var(--paper-raised);border:1px solid var(--rule);border-radius:2px 10px 10px 10px;box-shadow:var(--shadow);padding:26px 28px 28px;}
  .panel h2{font-family:'Fraunces', serif;font-size:20px;font-weight:600;margin:0 0 4px;}
  .panel .sub{font-family:'IBM Plex Mono', monospace;font-size:11px;color:var(--ink-soft);margin:0 0 20px;}

  /* ---- Add task form ---- */
  .add-form{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px;padding-bottom:22px;border-bottom:1px dashed var(--rule);}
  .add-form input[type=text]{
    flex:1 1 220px;font-family:'Work Sans',sans-serif;font-size:14px;
    padding:10px 12px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink);
  }
  .add-form input[type=text]:focus{outline:none;border-color:var(--trabalho);}
  select{
    font-family:'Work Sans',sans-serif;font-size:13px;padding:10px 10px;border:1px solid var(--rule);
    border-radius:6px;background:var(--paper);color:var(--ink);cursor:pointer;
  }
  .add-btn{
    font-family:'Work Sans',sans-serif;font-weight:600;font-size:13.5px;
    background:var(--ink);color:var(--paper-raised);border:none;border-radius:6px;padding:10px 18px;cursor:pointer;
  }
  .add-btn:hover{background:#3a3630;}

  /* ---- Task list ---- */
  .task-list{list-style:none;margin:0 0 22px;padding:0;display:flex;flex-direction:column;gap:8px;}
  .task{
    display:flex;align-items:center;gap:12px;
    padding:11px 13px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);
  }
  .task.done{opacity:0.5;}
  .task.done .task-text{text-decoration:line-through;}
  .task input[type=checkbox]{width:17px;height:17px;accent-color:var(--trabalho);cursor:pointer;flex-shrink:0;}
  .cat-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .cat-trabalho{background:var(--trabalho);}
  .cat-estudos{background:var(--estudos);}
  .cat-casa{background:var(--casa);}
  .cat-pessoal{background:var(--pessoal);}
  .task-text{flex:1;font-size:14.5px;}
  .task-cat{font-family:'IBM Plex Mono', monospace;font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;}
  .flag{font-family:'IBM Plex Mono', monospace;font-size:10px;text-transform:uppercase;letter-spacing:.06em;padding:3px 7px;border-radius:10px;flex-shrink:0;}
  .flag-alta{background:rgba(179,64,31,0.12);color:var(--high);}
  .flag-media{background:rgba(65,84,143,0.1);color:var(--trabalho);}
  .flag-baixa{background:rgba(104,98,91,0.1);color:var(--ink-soft);}
  .del-btn{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:16px;line-height:1;padding:2px 4px;flex-shrink:0;}
  .del-btn:hover{color:var(--high);}
  .empty-state{font-family:'IBM Plex Mono', monospace;font-size:12.5px;color:var(--ink-soft);padding:20px 0;text-align:center;border:1px dashed var(--rule);border-radius:8px;}

  /* ---- Notes ---- */
  .notes-label{font-family:'IBM Plex Mono', monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-soft);margin:0 0 8px;}
  textarea{
    width:100%;min-height:70px;font-family:'Work Sans',sans-serif;font-size:14px;color:var(--ink);
    border:1px solid var(--rule);border-radius:8px;background:var(--paper);padding:12px;resize:vertical;
  }
  textarea:focus{outline:none;border-color:var(--trabalho);}

  footer{text-align:center;margin-top:24px;font-family:'IBM Plex Mono', monospace;font-size:10.5px;color:var(--ink-soft);}

  @media (prefers-reduced-motion: reduce){ .quote-card{transform:none;} }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <p class="brand-eyebrow">Planner semanal</p>
      <h1>Minha Agenda</h1>
    </div>
    <div class="today-pill" id="todayPill"></div>
  </header>

  <div class="quote-card">
    <p class="quote-label">Frase do dia</p>
    <p class="quote-text" id="quoteText"></p>
    <button class="quote-refresh" id="quoteRefresh">trocar frase →</button>
  </div>

  <nav class="day-tabs" id="dayTabs"></nav>

  <div class="panel">
    <h2 id="dayTitle"></h2>
    <p class="sub" id="daySub"></p>

    <form class="add-form" id="addForm">
      <input type="text" id="taskInput" placeholder="Adicionar tarefa..." required>
      <select id="catSelect">
        <option value="trabalho">Trabalho</option>
        <option value="estudos">Estudos</option>
        <option value="casa">Casa</option>
        <option value="pessoal">Pessoal</option>
      </select>
      <select id="prioSelect">
        <option value="alta">Alta</option>
        <option value="media" selected>Média</option>
        <option value="baixa">Baixa</option>
      </select>
      <button type="submit" class="add-btn">Adicionar</button>
    </form>

    <ul class="task-list" id="taskList"></ul>

    <p class="notes-label">Notas do dia</p>
    <textarea id="notesArea" placeholder="Lembretes soltos, ideias, o que não é bem uma tarefa..."></textarea>
  </div>

  <footer>seus dados ficam salvos neste dispositivo, só para você</footer>
</div>

<script>
const DAYS = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
const DAYS_SHORT = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const CAT_LABEL = {trabalho:"Trabalho", estudos:"Estudos", casa:"Casa", pessoal:"Pessoal"};

const QUOTES = [
  "Feito é melhor que perfeito.",
  "Um passo de cada vez ainda é um passo à frente.",
  "Organizar o caos de hoje é o presente que você dá ao amanhã.",
  "Nem tudo precisa ser hoje — mas precisa estar em algum lugar.",
  "Pequenas rotinas sustentam grandes objetivos.",
  "Você não precisa ver a escada toda, só o próximo degrau.",
  "Prioridade não é fazer tudo, é escolher o que importa primeiro.",
  "O dia rende mais quando a cabeça está livre — anote e siga.",
  "Consistência vence intensidade.",
  "Sua agenda é um mapa, não uma prova.",
  "Comece pelo que te dá mais medo — o resto fica leve depois.",
  "Progresso imperfeito ainda é progresso.",
  "Cuidar de várias coisas ao mesmo tempo também é uma habilidade — e você já tem ela.",
  "Respire. Depois, risque o primeiro item da lista.",
  "O que não está escrito, disputa espaço com tudo o mais na sua cabeça."
];

let state = { tasks: {}, notes: {}, quoteIndex: null };
let currentDay = new Date().getDay();
const todayIndex = new Date().getDay();

async function loadState(){
  try{
    const res = await window.storage.get('agenda-state', false);
    if(res && res.value){ state = JSON.parse(res.value); }
  }catch(e){ /* sem dados salvos ainda */ }
  DAYS.forEach((_,i)=>{ if(!state.tasks[i]) state.tasks[i]=[]; if(state.notes[i]===undefined) state.notes[i]=''; });
}

async function saveState(){
  try{ await window.storage.set('agenda-state', JSON.stringify(state), false); }
  catch(e){ console.error('Falha ao salvar', e); }
}

function dayOfYear(d){
  const start = new Date(d.getFullYear(),0,0);
  const diff = d - start;
  return Math.floor(diff / 86400000);
}

function pickQuoteForToday(){
  if(state.quoteIndex === null || state.quoteIndex === undefined){
    state.quoteIndex = dayOfYear(new Date()) % QUOTES.length;
  }
  return QUOTES[state.quoteIndex];
}

function renderQuote(){
  document.getElementById('quoteText').textContent = '“' + pickQuoteForToday() + '”';
}

function renderTodayPill(){
  const d = new Date();
  const formatted = d.toLocaleDateString('pt-BR', {weekday:'long', day:'numeric', month:'long'});
  document.getElementById('todayPill').textContent = formatted.charAt(0).toUpperCase()+formatted.slice(1);
}

function renderTabs(){
  const nav = document.getElementById('dayTabs');
  nav.innerHTML = '';
  DAYS_SHORT.forEach((label,i)=>{
    const btn = document.createElement('button');
    btn.className = 'day-tab' + (i===currentDay ? ' active':'') + (hasPending(i) ? ' has-pending':'');
    btn.innerHTML = label + (i===todayIndex ? ' •' : '') + '<span class="dot"></span>';
    btn.onclick = ()=>{ currentDay = i; renderAll(); };
    nav.appendChild(btn);
  });
}

function hasPending(i){
  return (state.tasks[i]||[]).some(t=>!t.done);
}

function renderPanel(){
  document.getElementById('dayTitle').textContent = DAYS[currentDay];
  const pending = (state.tasks[currentDay]||[]).filter(t=>!t.done).length;
  const total = (state.tasks[currentDay]||[]).length;
  document.getElementById('daySub').textContent = total===0
    ? 'Nenhuma tarefa ainda'
    : pending + ' de ' + total + ' pendente' + (pending===1?'':'s');
}

function renderTasks(){
  const list = document.getElementById('taskList');
  list.innerHTML = '';
  const tasks = state.tasks[currentDay] || [];
  if(tasks.length === 0){
    const empty = document.createElement('li');
    empty.className = 'empty-state';
    empty.textContent = 'Nada por aqui — adicione a primeira tarefa do dia.';
    list.appendChild(empty);
    return;
  }
  const order = {alta:0, media:1, baixa:2};
  tasks.slice().sort((a,b)=> (a.done-b.done) || (order[a.prio]-order[b.prio]))
    .forEach(t=>{
      const li = document.createElement('li');
      li.className = 'task' + (t.done ? ' done':'');
      li.innerHTML = `
        <input type="checkbox" ${t.done?'checked':''} data-id="${t.id}">
        <span class="cat-dot cat-${t.cat}"></span>
        <span class="task-text">${escapeHtml(t.text)}</span>
        <span class="task-cat">${CAT_LABEL[t.cat]}</span>
        <span class="flag flag-${t.prio}">${t.prio}</span>
        <button class="del-btn" data-id="${t.id}" aria-label="Remover">✕</button>
      `;
      list.appendChild(li);
    });

  list.querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change', async (e)=>{
      const id = e.target.getAttribute('data-id');
      const task = state.tasks[currentDay].find(t=>t.id===id);
      if(task){ task.done = e.target.checked; await saveState(); renderTabs(); renderPanel(); renderTasks(); }
    });
  });
  list.querySelectorAll('.del-btn').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      const id = e.target.getAttribute('data-id');
      state.tasks[currentDay] = state.tasks[currentDay].filter(t=>t.id!==id);
      await saveState(); renderAll();
    });
  });
}

function renderNotes(){
  document.getElementById('notesArea').value = state.notes[currentDay] || '';
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderAll(){
  renderTabs();
  renderPanel();
  renderTasks();
  renderNotes();
}

document.getElementById('addForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const input = document.getElementById('taskInput');
  const text = input.value.trim();
  if(!text) return;
  const task = {
    id: Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    text,
    cat: document.getElementById('catSelect').value,
    prio: document.getElementById('prioSelect').value,
    done:false
  };
  state.tasks[currentDay].push(task);
  input.value = '';
  await saveState();
  renderAll();
});

let notesTimer;
document.getElementById('notesArea').addEventListener('input', (e)=>{
  state.notes[currentDay] = e.target.value;
  clearTimeout(notesTimer);
  notesTimer = setTimeout(saveState, 500);
});

document.getElementById('quoteRefresh').addEventListener('click', async ()=>{
  let next;
  do{ next = Math.floor(Math.random()*QUOTES.length); } while(next === state.quoteIndex && QUOTES.length>1);
  state.quoteIndex = next;
  renderQuote();
  await saveState();
});

(async function init(){
  await loadState();
  renderTodayPill();
  renderQuote();
  renderAll();
})();
</script>
</body>
</html>
